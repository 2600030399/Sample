<body>
    <h1>Registration form</body>h1>

        <label>Enter Your Name:</label><input type="text" name="uname"><br>
        <label>Enter Father Name:</label><input type="text" name="fname"><br>
        <label>Enter Mother Name:</label><input type="text" name="mname"><br>
        <label>Enter Your Mobile Number:</label><input type="text" number="mobile"><br>
        <label>Enter Your Email id:</label><input type="text" email="mail"><br>
        <label>Enter Your Address:</label><textarea name="address"></textarea><br>
        <label>Enter Your Gender:</label>
        <input type="radio" name="gender1"value="male">Male 
        <input type="radio" name="gender2"value="female">female
        <input type="radio" name="gender3"value="others">Others<br><br>
        <label>Select your hobbies:</label><br>
        <input type="checkbox" name="hobbies" value="reading">Reading
        <input type="checkbox" name="hobbies" value="writing">Writing
        <input type="checkbox" name="hobbies" value="swimming">Swimming
        <label>Select your country:</label>
        <select name="country">
          <option value="india">India</option>
          <option value="usa">USA</option>
          <option value="uk">UK</option>
          <option value="australia">Australia</option>
</select><br><br>
<label>Select your state:</label>
<select name="state"
    <option value="maharashtra">Maharashtra</option>
    <option value="gujarat">Gujararat</option>
    <option value="rajastan">Rajastan</option>
    <option value="punjab">Punjab</option><br><br>
</select><br><br>
<label>Enter Your Password:</label>
<input type="password" name="pwd"><br><br>
<label>Date of Birth:</label><input type="date" name="dob"><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</body>
